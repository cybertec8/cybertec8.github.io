<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#1f5eff;--bd:#dcd8cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#f2f2f4;--mu:#9a9aa2;--ac:#6b93ff;--bd:#38383f}}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;font-weight:500}
main{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:14px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:grid;gap:12px}
input,select,button{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}

button:disabled{opacity:.6}
canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--bd)}

p{margin:0;font-size:13px;color:var(--mu)}
</style>

const F={w:600,f:'"Cormorant SC",Georgia,serif',s:115,b:705};
function draw(){
  if(!ready)return;
  cv.width=img.naturalWidth;cv.height=img.naturalHeight;
  ctx.drawImage(img,0,0);
  const t=$('name').value.trim();
  if(!t)return;
  let fs=F.s;
  ctx.font=F.w+' '+fs+'px '+F.f;
  const w=ctx.measureText(t).width;
  if(w>MAXW){fs=Math.floor(fs*MAXW/w);}
  ctx.font=F.w+' '+fs+'px '+F.f;
  ctx.fillStyle='#d10f1f';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(t,CX,F.b);
}
async function redraw(){try{await document.fonts.load(F.w+' 60px '+F.f,$('name').value||'A');}catch(e){}draw();}
img.onload=()=>{ready=true;redraw();};img.src=SRC;
$('name').addEventListener('input',redraw);
$('dl').addEventListener('click',async()=>{
  const msg=$('msg'),name=$('name').value.trim();
  if(!name){msg.textContent='Please enter your name first.';return;}
  await redraw();
  try{
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,297,210);
    const fn=name.replace(/[\\/:*?"<>|]/g,'')+' - Certificate.pdf';
    const a=document.createElement('a');a.href=URL.createObjectURL(pdf.output('blob'));a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    msg.textContent='Certificate downloaded ✓';
  }catch(e){msg.textContent='Download failed, please try again.';}
});
